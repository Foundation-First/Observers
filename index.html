<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>VQB5 Local CLASS Observation Feedback Forms</title>
<style>
:root{--ink:#1c2b36;--blue:#12679b;--blue-dark:#0c4a72;--green:#99cb3b;--orange:#f99939;--line:#b8c7d3}
*{box-sizing:border-box}
body{margin:0;background:#e8eef3;color:var(--ink);font:1.0625rem/1.5 Calibri,Carlito,"Segoe UI","Helvetica Neue",Arial,sans-serif}
main{max-width:34rem;margin:0 auto;padding:clamp(1.5rem,6vw,3.5rem) 1rem}
header{padding-bottom:1.1rem;border-bottom:4px solid var(--blue);position:relative;margin-bottom:2rem}
header::after{content:"";position:absolute;left:50%;margin-left:-22px;bottom:-11px;width:44px;height:10px;background:radial-gradient(circle at 5px 5px,var(--green) 4px,transparent 4.5px),radial-gradient(circle at 22px 5px,var(--blue) 4px,transparent 4.5px),radial-gradient(circle at 39px 5px,var(--orange) 4px,transparent 4.5px)}
h1{margin:0 0 .4rem;font-size:clamp(1.4rem,5vw,1.8rem);line-height:1.2;color:var(--blue-dark)}
p{margin:0}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
a{display:block;padding:1.1rem 1.25rem;background:#fff;border:1px solid var(--line);border-left:8px solid var(--c);color:var(--blue-dark);font-size:1.35rem;font-weight:700;text-decoration:none}
a:hover{background:#e8f2f9}
a:focus-visible{outline:3px solid var(--blue-dark);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header>
    <h1>VQB5 Local CLASS Observation Feedback Forms</h1>
    <p>Choose the form for the age group you observed.</p>
  </header>
  <nav aria-label="Feedback forms">
    <ul>
      <li><a href="infant-form/index.html" style="--c:var(--green)">Infant</a></li>
      <li><a href="toddler-form/index.html" style="--c:var(--blue)">Toddler</a></li>
      <li><a href="prek-form/index.html" style="--c:var(--orange)">Pre-K</a></li>
    </ul>
  </nav>
</main>
</body>
</html>
